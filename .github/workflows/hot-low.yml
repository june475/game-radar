name: Refresh Popular Low-Price Games
on:
  schedule:
    # 07:05 UTC = 15:05 Asia/Shanghai, after the normal daily discovery.
    - cron: "5 7 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which independent popular-deals tasks to run"
        required: true
        type: choice
        options: [all, hot]
        default: all
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: game-radar-operations
  cancel-in-progress: false
jobs:
  refresh-popular:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python and tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Scan popular Steam specials and documented low prices
        run: python scripts/hot_low.py
      - name: Commit new popular shortlist if changed
        id: changes
        run: |
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/hot_low.json data/hot_low_cache.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh popular low price Steam shortlist"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          path: .
      - name: Publish hot-list update
        id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
