name: Collect and Repair Game Radar Data
on:
  schedule:
    # Daily discovery at Beijing 14:20; hourly checks at minute 35.
    - cron: "20 6 * * *"
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "all = discovery plus missing-category repair; daily = discovery; compensate = repair"
        required: false
        type: choice
        options:
          - all
          - daily
          - compensate
        default: all
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: game-radar-operations
  cancel-in-progress: false
jobs:
  collect-and-republish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check current recommendations first
        id: check
        env:
          RADAR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '20 6 * * *' && 'daily' || 'compensate' }}
        run: python scripts/check_recommendations.py "$RADAR_MODE"
      - name: Validate source and tests
        if: steps.check.outputs.run == 'true'
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Collect incrementally
        if: steps.check.outputs.run == 'true'
        env:
          RADAR_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '20 6 * * *' && 'daily' || 'compensate' }}
        run: |
          if [ "$RADAR_MODE" = "all" ]; then
            echo "Phase 1: daily discovery"
            RADAR_MODE=daily python scripts/update.py
            echo "Phase 2: compensate missing recommendation categories"
            RADAR_MODE=compensate python scripts/update.py
          else
            python scripts/update.py
          fi
      - name: Export observed price history
        if: steps.check.outputs.run == 'true'
        run: python scripts/export_price_history.py
      - name: Commit updated data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "game-radar-bot"
          git config user.email "game-radar-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh game radar data"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.run == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.run == 'true'
        with:
          path: .
      - name: Republish data without waiting for next daily publish
        if: steps.check.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
