name: Validate Game Radar Code
on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "app.js"
      - ".github/workflows/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run all unit tests
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Validate front-end JavaScript syntax
        run: node --check app.js
